plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
	// API 문서화 — 테스트가 캡처한 요청/응답 → OpenAPI 3 스펙(build/api-spec/openapi3.yaml).
	// 관련 설계: docs/api-docs-strategy.md
	id 'com.epages.restdocs-api-spec' version '0.19.4'
}

group = 'com.bviit'
version = '0.0.1-SNAPSHOT'
description = 'B&VIIT Analytics Dashboard'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// 소스에 한글(에러 메시지·주석 등)이 있어 컴파일 인코딩을 UTF-8로 고정한다.
// 미지정 시 gradle 데몬 JVM의 플랫폼 기본 charset(한글 Windows=MS949)으로 컴파일돼
// 한글 문자열 리터럴이 빌드 시점에 깨질 수 있다(머신·CI마다 비결정적).
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    // 1. 우리 회사의 넥서스 주소 추가 (중요: allowInsecureProtocol도 필요함)
    maven {
        url "https://nexus.loocusiol.com/repository/maven-public/"
        allowInsecureProtocol = true

        // Credential 우선순위: -P gradle property > env(nexusUsername) > env(NEXUS_USERNAME).
        // Docker 빌드 시 BuildKit secret 또는 --build-arg 로 주입.
        credentials {
            username = project.findProperty('nexusUsername')
                    ?: System.getenv('nexusUsername')
                    ?: System.getenv('NEXUS_USERNAME')
            password = project.findProperty('nexusPassword')
                    ?: System.getenv('nexusPassword')
                    ?: System.getenv('NEXUS_PASSWORD')
        }
    }
}

def frontendDistDir = file("${projectDir}/../frontend/dist")

dependencies {
	// 솔라피(SOLAPI) 문자·알림톡 발송 SDK — 문자 발송 관리(sms 도메인) 전용.
	implementation 'com.solapi:sdk:1.0.3'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	runtimeOnly 'com.h2database:h2'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'net.sourceforge.jtds:jtds:1.3.1'
	// 레거시 홈페이지 온라인 예약 소스(읽기 전용) — HomepageDataSourceConfig 참조.
	// homepage.datasource.url 미설정 시 DataSource 자체가 안 뜨므로 런타임에 로드되지 않는다.
	// 소스는 둘 중 하나다. 방언은 URL 접두사로 자동 판별한다(HomepageSourceDialect).
	//   jdbc:sqlite:  — 로컬 스냅샷 파일 (기본. 자격증명·터널 불필요, 데이터는 스냅샷 시점까지)
	//   jdbc:mariadb: — 레거시 운영 DB 직결 (실시간. SSH 터널 + 계정 필요)
	runtimeOnly 'org.xerial:sqlite-jdbc:3.47.1.0'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.1'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	// Swagger UI 정적 자산 — /webjars/swagger-ui-dist/5.20.0/* 로 Spring Boot 가 자동 서빙.
	// src/main/resources/static/docs/index.html 이 이 자산으로 /docs/openapi3.yaml 을 렌더한다.
	implementation 'org.webjars.npm:swagger-ui-dist:5.20.0'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// REST Docs (MockMvc) + restdocs-api-spec — 테스트가 실제 요청/응답을 캡처해 OpenAPI 스펙으로 생성.
	// 관련 설계: docs/api-docs-strategy.md
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.19.4'
	testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
	testImplementation 'org.testcontainers:postgresql:1.20.4'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'com.visuworks.lib:slack-logger:1.0.0'
}

// REST Docs 스니펫 출력 위치 — openapi3 태스크가 이 디렉토리를 읽어 스펙을 만든다.
def snippetsDir = layout.buildDirectory.dir('generated-snippets')

// 유닛 테스트 — CI 기본 실행. Testcontainers(Docker) 필요한 *IT 는 클래스 어노테이션으로 자체 스킵.
tasks.named('test', Test) {
	useJUnitPlatform()
	// 스니펫을 test 태스크의 출력으로 등록 — 없으면 test 결과가 FROM-CACHE 될 때
	// generated-snippets/ 가 복원되지 않아 openapi3 가 빈 paths 로 생성됨.
	outputs.dir(snippetsDir)
}

// 통합 테스트 — Docker 있는 환경에서 명시적으로: ./gradlew integrationTest
// *IT 클래스에 @EnabledIfEnvironmentVariable(RUN_INTEGRATION_TESTS=true) 이 걸려있어
// 이 태스크에서만 env 를 세팅해 JUnit condition 을 통과시킨다.
tasks.register('integrationTest', Test) {
	description = 'Runs *IT integration tests (requires Docker for Testcontainers).'
	group = 'verification'
	useJUnitPlatform()
	include '**/*IT.class'
	environment 'RUN_INTEGRATION_TESTS', 'true'
	shouldRunAfter tasks.named('test')
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
}

tasks.named('processResources') {
	from(frontendDistDir) {
		into 'static'
	}
}

// ─── API 문서화 (docs/api-docs-strategy.md) ────────────────────────────────
// openapi3 산출물(build/api-spec/openapi3.yaml)을 static 리소스로 끌어와 /docs/openapi3.yaml 로 서빙한다.
// - 로컬: ./gradlew test openapi3 실행 시 finalizedBy 로 자동 복사.
// - Docker(Dockerfile/Dockerfile.local): 이미지 빌드 안에서 `./gradlew clean openapi3 bootJar` 를 돌린다.
//   Jenkins 파이프라인이 별도 test 스테이지를 갖고 있어도 스펙은 도커 빌드에서 자체 생성돼 이미지에 포함된다.
// - 파일은 .gitignore 로 배제 — 매 빌드마다 새로 만든다.
openapi3 {
	servers = [
		{ url = 'https://dashboard.bnviit-ai.com'; description = 'Production' },
		{ url = 'http://192.168.6.102:5000';       description = 'Development' },
		{ url = 'http://localhost:18080';          description = 'Local' }
	]
	title = 'B&VIIT Analytics API'
	version = project.version
	format = 'yaml'
	description = '안과(B&VIIT) KPI 대시보드 API — 세부 규칙은 CLAUDE.md · AGENTS.md 참조.'
}

// bootJar 가 openapi3.yaml 을 직접 포함한다.
//   - src/main/resources 로 복사하면 processResources 가 이미 지나간 뒤라 반영 안 됨
//   - build/resources/main 으로 복사하면 resolveMainClassName 등 다른 컨슈머와 암시적 의존 충돌
//   - bootJar 에 from() 으로 파일을 직접 붙이면 위 둘을 모두 우회
// 관련 설계: docs/api-docs-strategy.md
afterEvaluate {
	tasks.named('openapi3') {
		// restdocs-api-spec 플러그인의 `servers` 입력이 swagger-core `Server`(Serializable 아님)라
		// `--build-cache` 사용 시 fingerprint 실패 + 캐시 미스 시 stale 결과 복원 문제가 있다.
		// doNotTrackState 로 상태 추적을 꺼서 매 빌드 강제 재실행 (스펙 재생성 비용은 미미).
		doNotTrackState('swagger-core Server 는 Serializable 이 아니라 fingerprint 불가 — 매 빌드 재실행')
	}
	tasks.named('bootJar') {
		dependsOn 'openapi3'
		from(layout.buildDirectory.file('api-spec/openapi3.yaml')) {
			into 'BOOT-INF/classes/static/docs'
		}
	}
}

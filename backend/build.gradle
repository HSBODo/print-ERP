plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bviit'
version = '0.0.1-SNAPSHOT'
description = 'B&VIIT Analytics Dashboard'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// 소스에 한글(에러 메시지·주석 등)이 있어 컴파일 인코딩을 UTF-8로 고정한다.
// 미지정 시 gradle 데몬 JVM의 플랫폼 기본 charset(한글 Windows=MS949)으로 컴파일돼
// 한글 문자열 리터럴이 빌드 시점에 깨질 수 있다(머신·CI마다 비결정적).
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

repositories {
	mavenCentral()
}

def frontendDistDir = file("${projectDir}/../frontend/dist")

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.xerial:sqlite-jdbc:3.49.1.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'net.sourceforge.jtds:jtds:1.3.1'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
	testImplementation 'org.testcontainers:postgresql:1.20.4'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// 유닛 테스트 — CI 기본 실행. Testcontainers(Docker) 필요한 *IT 는 클래스 어노테이션으로 자체 스킵.
tasks.named('test', Test) {
	useJUnitPlatform()
}

// 통합 테스트 — Docker 있는 환경에서 명시적으로: ./gradlew integrationTest
// *IT 클래스에 @EnabledIfEnvironmentVariable(RUN_INTEGRATION_TESTS=true) 이 걸려있어
// 이 태스크에서만 env 를 세팅해 JUnit condition 을 통과시킨다.
tasks.register('integrationTest', Test) {
	description = 'Runs *IT integration tests (requires Docker for Testcontainers).'
	group = 'verification'
	useJUnitPlatform()
	include '**/*IT.class'
	environment 'RUN_INTEGRATION_TESTS', 'true'
	shouldRunAfter tasks.named('test')
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
}

tasks.named('processResources') {
	from(frontendDistDir) {
		into 'static'
	}
}

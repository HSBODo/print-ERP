plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
	// API 문서화 — 테스트가 캡처한 요청/응답 → OpenAPI 3 스펙(build/api-spec/openapi3.yaml).
	id 'com.epages.restdocs-api-spec' version '0.19.4'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Spring Boot + React App Template'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// 소스에 한글(에러 메시지·주석 등)이 있어 컴파일 인코딩을 UTF-8로 고정한다.
// 미지정 시 gradle 데몬 JVM의 플랫폼 기본 charset(한글 Windows=MS949)으로 컴파일돼
// 한글 문자열 리터럴이 빌드 시점에 깨질 수 있다(머신·CI마다 비결정적).
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

// 테스트 JVM 기본 charset 도 UTF-8 로 고정 — 한글 요청 본문을 다루는 REST Docs 테스트가 Windows(MS949)에서 깨지지 않게.
tasks.withType(Test).configureEach {
	defaultCharacterEncoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

def frontendDistDir = file("${projectDir}/../frontend/dist")

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	// DB 마이그레이션 — src/main/resources/db/migration/V*.sql 이 스키마의 정본이다.
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	// Swagger UI 정적 자산 — /webjars/swagger-ui-dist/5.20.0/* 로 Spring Boot 가 자동 서빙.
	// src/main/resources/static/docs/index.html 이 이 자산으로 /docs/openapi3.yaml 을 렌더한다.
	implementation 'org.webjars.npm:swagger-ui-dist:5.20.0'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// REST Docs (MockMvc) + restdocs-api-spec — 테스트가 실제 요청/응답을 캡처해 OpenAPI 스펙으로 생성.
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.19.4'
	testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
	testImplementation 'org.testcontainers:postgresql:1.20.4'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// REST Docs 스니펫 출력 위치 — openapi3 태스크가 이 디렉토리를 읽어 스펙을 만든다.
def snippetsDir = layout.buildDirectory.dir('generated-snippets')

// 유닛 테스트 — CI 기본 실행. Testcontainers(Docker) 필요한 *IT 는 클래스 어노테이션으로 자체 스킵.
tasks.named('test', Test) {
	useJUnitPlatform()
	// 스니펫을 test 태스크의 출력으로 등록 — 없으면 test 결과가 FROM-CACHE 될 때
	// generated-snippets/ 가 복원되지 않아 openapi3 가 빈 paths 로 생성됨.
	outputs.dir(snippetsDir)
}

// 통합 테스트 — Docker 있는 환경에서 명시적으로: ./gradlew integrationTest
// *IT 클래스에 @EnabledIfEnvironmentVariable(RUN_INTEGRATION_TESTS=true) 이 걸려있어
// 이 태스크에서만 env 를 세팅해 JUnit condition 을 통과시킨다.
tasks.register('integrationTest', Test) {
	description = 'Runs *IT integration tests (requires Docker for Testcontainers).'
	group = 'verification'
	useJUnitPlatform()
	include '**/*IT.class'
	environment 'RUN_INTEGRATION_TESTS', 'true'
	shouldRunAfter tasks.named('test')
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
}

tasks.named('processResources') {
	from(frontendDistDir) {
		into 'static'
	}
}

// ─── API 문서화 ────────────────────────────────────────────────────────────
// openapi3 산출물(build/api-spec/openapi3.yaml)을 static 리소스로 끌어와 /docs/openapi3.yaml 로 서빙한다.
// - 로컬: ./gradlew test openapi3 실행 시 finalizedBy 로 자동 복사.
// - Docker(Dockerfile): 이미지 빌드 안에서 `./gradlew clean openapi3 bootJar` 를 돌린다.
// - 파일은 .gitignore 로 배제 — 매 빌드마다 새로 만든다.
openapi3 {
	servers = [
		{ url = 'http://localhost:18080'; description = 'Local' }
	]
	title = 'App Template API'
	version = project.version
	format = 'yaml'
	description = 'App Template API — 세부 규칙은 CLAUDE.md · AGENTS.md 참조.'
}

// bootJar 가 openapi3.yaml 을 직접 포함한다.
//   - src/main/resources 로 복사하면 processResources 가 이미 지나간 뒤라 반영 안 됨
//   - build/resources/main 으로 복사하면 resolveMainClassName 등 다른 컨슈머와 암시적 의존 충돌
//   - bootJar 에 from() 으로 파일을 직접 붙이면 위 둘을 모두 우회
afterEvaluate {
	tasks.named('openapi3') {
		// restdocs-api-spec 플러그인의 `servers` 입력이 swagger-core `Server`(Serializable 아님)라
		// `--build-cache` 사용 시 fingerprint 실패 + 캐시 미스 시 stale 결과 복원 문제가 있다.
		// doNotTrackState 로 상태 추적을 꺼서 매 빌드 강제 재실행 (스펙 재생성 비용은 미미).
		doNotTrackState('swagger-core Server 는 Serializable 이 아니라 fingerprint 불가 — 매 빌드 재실행')
	}
	tasks.named('bootJar') {
		dependsOn 'openapi3'
		from(layout.buildDirectory.file('api-spec/openapi3.yaml')) {
			into 'BOOT-INF/classes/static/docs'
		}
	}
}

// bootRun 시 backend/.env (KEY=VALUE) 를 환경변수로 주입한다 — 로컬 개발 편의.
tasks.named('bootRun') {
	def envFile = file('.env')
	if (envFile.exists()) {
		envFile.eachLine { line ->
			def trimmed = line.trim()
			if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
				def parts = trimmed.split('=', 2)
				environment parts[0].trim(), parts[1].trim()
			}
		}
	}
}

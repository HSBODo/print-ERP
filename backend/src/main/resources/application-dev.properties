# ========================================
# DEV — 팀 공용 개발서버
# ========================================
# - Primary DB: Dev 전용 Postgres (외부 인스턴스, prod와 분리)
# - CRM MSSQL: Admin 트리거 시에만 접근 (읽기)
# - 배치 스케줄러: OFF (dev 데이터는 관리자 트리거로만 채움)
# - 배치 트리거(Admin API): ON — POST /api/admin/batch/rerun
#
# 실행: SPRING_PROFILES_ACTIVE=dev java -jar app.jar
# 배포 환경변수 필수: POSTGRES_*, BNVIIT_CRM_DB_*
#
# ─── 프로파일 비교 (local vs dev vs prod) ────────────────────────
# 항목                     | local                        | dev                     | prod
# 용도                     | 개인 개발 머신               | 팀 공용 개발서버        | 운영
# Primary DB (Postgres)    | 로컬 Docker(localhost:5432)  | Dev 외부 인스턴스       | Prod 외부 인스턴스
# CRM MSSQL                | 미접속(더미)                 | 실 CRM(읽기)            | 실 CRM(읽기)
# Hikari(CRM) pool/timeout | 1 / 1s                       | 3 / 10s                 | 3 / 10s
# ddl-auto                 | update                       | update                  | none
# 배치 스케줄러            | OFF                          | OFF                     | ON(03:00 D-1, 매월 1일 03:30)
# Admin 수동 배치          | OFF(CRM 없음)                | ON                      | ON
# app.seed.enabled         | 상위 기본값(false)           | 상위 기본값             | 명시적 false
# 필수 env                 | POSTGRES_* (기본값 가능)     | POSTGRES_*, BNVIIT_CRM_*| POSTGRES_*, BNVIIT_CRM_*, APP_JWT_SECRET
# ================================================================
# ========================================

# --- Primary (Dev Postgres, 별도 인스턴스) ---
spring.datasource.url=${POSTGRES_URL:}
spring.datasource.username=${POSTGRES_USER:}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=false

# --- Batch source (실 CRM MSSQL, 읽기 전용) ---
stats.datasource.url=${BNVIIT_CRM_DB_URL:}
stats.datasource.username=${BNVIIT_CRM_DB_USERNAME:}
stats.datasource.password=${BNVIIT_CRM_DB_PASSWORD:}
stats.datasource.driver-class-name=net.sourceforge.jtds.jdbc.Driver
stats.datasource.hikari.maximum-pool-size=3
stats.datasource.hikari.read-only=true
stats.datasource.hikari.connection-timeout=10000

# --- Batch scheduling (OFF — Admin 트리거로만 실행) ---
# runManual()은 enabled 무시하므로 관리자 API는 정상 동작.
batch.mart.enabled=false
batch.mart.daily-cron=-
batch.mart.monthly-reconcile-cron=-

# ========================================
# data-platform 프로파일 — 데이터 플랫폼 소스 라우팅 스위치
# ========================================
# 실행: SPRING_PROFILES_ACTIVE=dev,data-platform (또는 prod,data-platform, local,data-platform)
#
# 이 프로파일은 DataSource 를 새로 추가하지 않는다.
# `MartDataSourceConfig` 가 이미 stats(MSSQL) 과 warehouse(RDS Postgres) 두 빈을 병렬로 등록한다.
# 여기서는 리포지토리들이 "어느 소스를 쓸지" 결정하는 플래그(`data-platform.enabled`)를 켠다.
#
# 이관 완료된 리포지토리는 두 JdbcTemplate 을 모두 주입받고 이 플래그로 라우팅한다:
#   dataPlatformEnabled ? warehouseJdbcTemplate : statsJdbcTemplate
#   + SQL 파일도 sql/warehouse/... vs sql/softcrm/... 를 동일 기준으로 선택
#
# 이관 진행 중인 리포는 이 프로필과 무관하게 statsJdbcTemplate(=CRM MSSQL) 만 고정 사용.
# 이관 대상 확대 시 리포별로 이중 주입 패턴을 추가하면 자동으로 이 스위치를 따르게 된다.
#
# 정본 전략: docs/data-platform/migration-strategy.md.
# ========================================

data-platform:
  enabled: true

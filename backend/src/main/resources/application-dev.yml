# ========================================
# DEV — 팀 공용 개발서버
# ========================================
# - Primary DB: Dev 전용 Postgres (외부 인스턴스, prod와 분리)
# - CRM MSSQL: Admin 트리거 시에만 접근 (읽기)
# - 배치 스케줄러: ON (매일 03:00 D-1 적재, 매월 1일 03:30 전월 재계산)
# - 배치 트리거(Admin API): ON — POST /api/admin/batch/rerun
#
# 실행: SPRING_PROFILES_ACTIVE=dev java -jar app.jar
# 배포 환경변수 필수: POSTGRES_*, STATS_DB_*
#
# ─── 프로파일 비교 (local vs dev vs prod) ────────────────────────
# 항목                     | local                        | dev                     | prod
# 용도                     | 개인 개발 머신               | 팀 공용 개발서버        | 운영
# Primary DB (Postgres)    | 로컬 Docker(localhost:5432)  | Dev 외부 인스턴스       | Prod 외부 인스턴스
# CRM MSSQL                | 미접속(더미)                 | 실 CRM(읽기)            | 실 CRM(읽기)
# Hikari(CRM) pool/timeout | 1 / 1s                       | 3 / 10s                 | 3 / 10s
# ddl-auto                 | update                       | update                  | none
# 배치 스케줄러            | OFF                          | ON(03:00 D-1, 매월 1일 03:30) | ON(03:00 D-1, 매월 1일 03:30)
# Admin 수동 배치          | OFF(CRM 없음)                | ON                      | ON
# app.seed.enabled         | 상위 기본값(false)           | 상위 기본값             | 명시적 false
# 필수 env                 | POSTGRES_* (기본값 가능)     | POSTGRES_*, STATS_DB_*  | POSTGRES_*, STATS_DB_*, APP_JWT_SECRET
# ================================================================

spring:
  # --- Primary (Dev Postgres, 별도 인스턴스) ---
  datasource:
    url: ${POSTGRES_URL:}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false

# --- Batch source (실 CRM MSSQL, 읽기 전용) ---
stats:
  datasource:
    url: ${STATS_DB_URL:}
    username: ${STATS_DB_USERNAME:}
    password: ${STATS_DB_PASSWORD:}
    driver-class-name: net.sourceforge.jtds.jdbc.Driver
    hikari:
      maximum-pool-size: 3
      read-only: true
      connection-timeout: 10000

# --- Batch scheduling (ON — 상위 기본값 사용) ---
# 기본값: enabled=true, daily-cron='0 0 3 * * *', monthly-reconcile-cron='0 30 3 1 * *'
# min-year=2026 가드로 D-1 이 2026 미만이면 자동 skip.
batch:
  mart:
    enabled: true

# --- Slack 로그 알림 (ON) ---
# LOGGING_SLACK_WEBHOOK_URL 환경변수 필수(deploy 스크립트 주입). 미주입 시 라이브러리가 스킵.
logging:
  slack:
    enabled: true

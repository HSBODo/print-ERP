# ========================================
# PROD — 운영
# ========================================
# - Primary DB: Prod Postgres (외부 인스턴스)
# - CRM MSSQL: 실 CRM (SOFTCRM 등), 배치가 읽기
# - 배치 스케줄러: ON — 매일 03:00 D-1 append, 매월 1일 03:30 전월 재계산
# - 배치 트리거(Admin API): ON
#
# 실행: SPRING_PROFILES_ACTIVE=prod java -jar app.jar
# 배포 환경변수 필수: POSTGRES_*, STATS_DB_*, APP_JWT_SECRET
#
# ─── 프로파일 비교 (local vs dev vs prod) ────────────────────────
# 항목                     | local                        | dev                     | prod
# 용도                     | 개인 개발 머신               | 팀 공용 개발서버        | 운영
# Primary DB (Postgres)    | 로컬 Docker(localhost:5432)  | Dev 외부 인스턴스       | Prod 외부 인스턴스
# CRM MSSQL                | 미접속(더미)                 | 실 CRM(읽기)            | 실 CRM(읽기)
# Hikari(CRM) pool/timeout | 1 / 1s                       | 3 / 10s                 | 3 / 10s
# ddl-auto                 | update                       | update                  | none
# 배치 스케줄러            | OFF                          | OFF                     | ON(03:00 D-1, 매월 1일 03:30)
# Admin 수동 배치          | OFF(CRM 없음)                | ON                      | ON
# app.seed.enabled         | 상위 기본값(false)           | 상위 기본값             | 명시적 false
# 필수 env                 | POSTGRES_* (기본값 가능)     | POSTGRES_*, STATS_DB_*  | POSTGRES_*, STATS_DB_*, APP_JWT_SECRET
# ================================================================

spring:
  # --- Primary (Prod Postgres) ---
  datasource:
    url: ${POSTGRES_URL:}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: false

app:
  seed:
    enabled: false

# --- Batch source (실 CRM MSSQL, 읽기 전용) ---
stats:
  datasource:
    url: ${STATS_DB_URL:}
    username: ${STATS_DB_USERNAME:}
    password: ${STATS_DB_PASSWORD:}
    driver-class-name: net.sourceforge.jtds.jdbc.Driver
    hikari:
      maximum-pool-size: 3
      read-only: true
      connection-timeout: 10000

# --- Batch scheduling (ON) ---
batch:
  mart:
    enabled: true
    daily-cron: ${BATCH_MART_DAILY_CRON:0 0 3 * * *}
    # 월간 소급 재계산은 현재 비활성. 재활성화하려면 값을 "0 30 3 1 * *" 로 변경.
    monthly-reconcile-cron: "-"

# --- Slack 로그 알림 (ON) ---
# 운영에서 배치 실패·에러 즉시 감지. LOGGING_SLACK_WEBHOOK_URL 환경변수 필수(배포 스크립트 주입).
logging:
  slack:
    enabled: true

# ========================================
# PROD — 운영
# ========================================
# 실행: SPRING_PROFILES_ACTIVE=prod java -jar app.jar
# 필수 env: POSTGRES_URL · POSTGRES_USER · POSTGRES_PASSWORD · APP_JWT_SECRET
#
# 스키마는 기동 시 Flyway 가 db/migration/V*.sql 로 생성·갱신한다.
# 최초 배포 때만 APP_SEED_ENABLED=true + APP_SEED_ADMIN_PASSWORD 로 첫 관리자를 만들고, 이후 false 로 되돌린다
# (users 테이블이 비어 있을 때만 생성하므로 켜 둬도 덮어쓰지는 않는다).

spring:
  datasource:
    url: ${POSTGRES_URL:}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}

  jpa:
    properties:
      hibernate:
        format_sql: false

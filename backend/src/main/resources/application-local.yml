# ========================================
# LOCAL — 개인 개발 머신 (docker compose --profile mart)
# ========================================
# - Primary DB: 로컬 Docker Postgres (docker-compose.yml 의 postgres 서비스)
# - CRM MSSQL: 미접속 (더미 값)
# - 배치 스케줄러: OFF
# - 배치 트리거(Admin API): OFF (CRM 없이는 데이터 소스 없음)
#
# 실행: docker compose --profile mart up -d
# 또는: cd backend && ./gradlew bootRun --args='--spring.profiles.active=local'
#
# ─── 프로파일 비교 (local vs dev vs prod) ────────────────────────
# 항목                     | local                        | dev                     | prod
# 용도                     | 개인 개발 머신               | 팀 공용 개발서버        | 운영
# Primary DB (Postgres)    | 로컬 Docker(localhost:5432)  | Dev 외부 인스턴스       | Prod 외부 인스턴스
# CRM MSSQL                | 미접속(더미)                 | 실 CRM(읽기)            | 실 CRM(읽기)
# Hikari(CRM) pool/timeout | 1 / 1s                       | 3 / 10s                 | 3 / 10s
# ddl-auto                 | update                       | update                  | none
# 배치 스케줄러            | OFF                          | OFF                     | ON(03:00 D-1, 매월 1일 03:30)
# Admin 수동 배치          | OFF(CRM 없음)                | ON                      | ON
# app.seed.enabled         | 상위 기본값(false)           | 상위 기본값             | 명시적 false
# 필수 env                 | POSTGRES_* (기본값 가능)     | POSTGRES_*, STATS_DB_*  | POSTGRES_*, STATS_DB_*, APP_JWT_SECRET
# ================================================================

spring:
  # --- Primary (로컬 Docker Postgres) ---
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:analytics}}
    username: ${POSTGRES_USER:analytics}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false

# --- Batch source (미사용, 더미) ---
# 로컬은 CRM 접근하지 않음. 빈 문자열이면 HikariCP가 커넥션 시도 시 실패하니 더미로 채움.
stats:
  datasource:
    url: ${STATS_DB_URL:jdbc:jtds:sqlserver://localhost:0/dummy}
    username: ${STATS_DB_USERNAME:dummy}
    password: ${STATS_DB_PASSWORD:}
    driver-class-name: net.sourceforge.jtds.jdbc.Driver
    hikari:
      maximum-pool-size: 1
      read-only: true
      connection-timeout: 1000

# --- Batch scheduling (OFF) ---
batch:
  mart:
    enabled: false
    daily-cron: "-"
    monthly-reconcile-cron: "-"

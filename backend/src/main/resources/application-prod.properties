# ========================================
# PROD — 운영
# ========================================
# - Primary DB: Prod Postgres (외부 인스턴스)
# - CRM MSSQL: 실 CRM (SOFTCRM 등), 배치가 읽기
# - 배치 스케줄러: ON — 매일 03:00 D-1 append, 매월 1일 03:30 전월 재계산
# - 배치 트리거(Admin API): ON
#
# 실행: SPRING_PROFILES_ACTIVE=prod java -jar app.jar
# 배포 환경변수 필수: POSTGRES_*, BNVIIT_CRM_DB_*, APP_JWT_SECRET
# ========================================

# --- Primary (Prod Postgres) ---
spring.datasource.url=${POSTGRES_URL:}
spring.datasource.username=${POSTGRES_USER:}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false
app.seed.enabled=false

# --- Batch source (실 CRM MSSQL, 읽기 전용) ---
stats.datasource.url=${BNVIIT_CRM_DB_URL:}
stats.datasource.username=${BNVIIT_CRM_DB_USERNAME:}
stats.datasource.password=${BNVIIT_CRM_DB_PASSWORD:}
stats.datasource.driver-class-name=net.sourceforge.jtds.jdbc.Driver
stats.datasource.hikari.maximum-pool-size=3
stats.datasource.hikari.read-only=true
stats.datasource.hikari.connection-timeout=10000

# --- Batch scheduling (ON) ---
batch.mart.enabled=true
batch.mart.daily-cron=${BATCH_MART_DAILY_CRON:0 0 3 * * *}
batch.mart.monthly-reconcile-cron=${BATCH_MART_MONTHLY_CRON:0 30 3 1 * *}

spring:
  application:
    name: app-template

  # ── Datasource (PostgreSQL) ─────────────────────────────────────────
  # 각 프로파일에서 POSTGRES_* 환경변수로 호스트·계정을 지정한다.
  # 테스트는 spring.datasource.url=jdbc:h2:mem:... 로 오버라이드 (H2 는 testRuntimeOnly).
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:app}}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD:}

  # 스키마는 Flyway(db/migration/V*.sql)가 만들고, Hibernate 는 엔티티와 일치하는지 검증만 한다.
  # 새 엔티티·컬럼을 추가하면 V{n}__설명.sql 을 함께 추가할 것.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    time-zone: Asia/Seoul

# Server
server:
  port: ${SERVER_PORT:18080}

app:
  # JWT — 운영용 기본값 없음. APP_JWT_SECRET(32자 이상)을 반드시 주입한다.
  jwt:
    secret: ${APP_JWT_SECRET:}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:15173}
  # 최초 관리자 계정 시드 — users 테이블이 비어 있을 때만 1회 생성.
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    admin-login-id: ${APP_SEED_ADMIN_LOGIN_ID:admin}
    admin-email: ${APP_SEED_ADMIN_EMAIL:admin@example.com}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:}
    admin-name: ${APP_SEED_ADMIN_NAME:관리자}

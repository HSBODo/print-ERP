services:
  blue-prod-bnviit-dashboard:
    image: 708289399808.dkr.ecr.ap-northeast-2.amazonaws.com/bnviit/bnviit-dashboard:${BNVIIT_DASHBOARD_TAG}
    container_name: blue-prod-bnviit-dashboard
    restart: unless-stopped
    ports:
      - "50000:18080"
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN}
      INFISICAL_API_URL: ${INFISICAL_API_URL}
      INFISICAL_PROJECT_ID: "2a424b8f-7518-4c5d-a097-d323dc7b2e95"
      INFISICAL_ENV: "prod"
    volumes:
      - analytics-cache:/app/.cache
    networks:
      bnviit_dashboard_network:
        ipv4_address: "172.31.0.194"
  green-prod-bnviit-dashboard:
    image: 708289399808.dkr.ecr.ap-northeast-2.amazonaws.com/bnviit/bnviit-dashboard:${BNVIIT_DASHBOARD_TAG}
    container_name: green-prod-bnviit-dashboard
    restart: unless-stopped
    ports:
      - "50001:18080"
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN}
      INFISICAL_API_URL: ${INFISICAL_API_URL}
      INFISICAL_PROJECT_ID: "2a424b8f-7518-4c5d-a097-d323dc7b2e95"
      INFISICAL_ENV: "prod"
    volumes:
      - analytics-cache:/app/.cache
    networks:
      bnviit_dashboard_network:
        ipv4_address: "172.31.0.195"
volumes:
  analytics-cache:
networks:
  bnviit_dashboard_network:
    driver: bridge
    ipam:
      config:
        - subnet: "172.31.0.192/28"
          gateway: "172.31.0.193"

# ─────────────────────────────────────────────────────────────
# 로컬 자립형 compose — 앱 + 로컬 Postgres(마트) + 데이터 플랫폼(RDS) 라우팅.
#
# 사용법:
#   DOCKER_BUILDKIT=1 docker compose -f docker-compose.localdb.yml up -d --build
#   docker compose -f docker-compose.localdb.yml down
#   docker compose -f docker-compose.localdb.yml down -v    # DB 데이터까지 삭제
#
# docker-compose.local.yml 과의 차이:
#   1) postgres 서비스 포함 (postgres:16-alpine, 데이터는 볼륨에 유지 — 마트 DB)
#   2) 앱의 POSTGRES_* 는 backend/.env 대신 로컬 컨테이너로 강제 오버라이드
#   3) analytics 는 postgres healthcheck 통과 후 기동
#   4) SPRING_PROFILES_ACTIVE 기본값이 `local,data-platform` — 이관 완료된 리포지토리는
#      CRM MSSQL 대신 신규 데이터 플랫폼(RDS Postgres bnviit_datawarehouse) 로 조회.
#      이관 안 된 리포는 여전히 CRM MSSQL(=`backend/.env` 의 STATS_DB_*) 를 사용.
#      원본 CRM 경로만 검증하려면 `SPRING_PROFILES_ACTIVE=local` 로 오버라이드.
#      필요 env: RDS_HOST, RDS_PORT, RDS_DB, RDS_USER, RDS_PASSWORD (backend/.env).
#      정본: docs/data-platform/migration-strategy.md.
#
# 원격 사내 Postgres(192.168.x) 에 붙어 개발하려면 이 파일 대신 docker-compose.local.yml 사용.
# CRM(MSSQL) 등 다른 원격 데이터소스는 여전히 backend/.env 에서 조달한다.
# ─────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    container_name: bviit-postgres-local
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      POSTGRES_USER: ${POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analytics}
    volumes:
      - postgres-data-localdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analytics} -d ${POSTGRES_DB:-analytics}"]
      interval: 5s
      timeout: 3s
      retries: 20

  analytics:
    build:
      context: .
      dockerfile: Dockerfile.local
      secrets:
        - nexus_id
        - nexus_pw
    image: bviit-analytics:${IMAGE_TAG:-local}
    container_name: bviit-analytics-localdb
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-18080}:18080"
    env_file:
      - backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local,data-platform}
      SERVER_PORT: "18080"
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:18080}
      STATS_CACHE_DIR: /app/.cache/stats
      # ── POSTGRES_* 는 로컬 postgres 컨테이너로 강제 오버라이드 ──
      # backend/.env 의 사내 원격 Postgres 값을 덮어써서 이 스택이 자립 실행되도록 한다.
      # 나머지 도메인 env(HOMEPAGE_DATASOURCE_URL, STATS_DB_* 등)는 backend/.env 그대로 사용.
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-analytics}
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      POSTGRES_USER: ${POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analytics}
    volumes:
      - analytics-cache-localdb:/app/.cache

volumes:
  analytics-cache-localdb:
  postgres-data-localdb:

secrets:
  nexus_id:
    environment: NEXUS_USERNAME
  nexus_pw:
    environment: NEXUS_PASSWORD

services:
  # ─────────────────────────────────────────────────────────────
  # Postgres — 외부 개발 DB 를 사용하므로 컨테이너 기동 비활성화.
  # 재활성화하려면 아래 블록·depends_on·postgres-data 볼륨 주석을 해제하고
  # docker compose --profile mart up -d 로 기동한다.
  # 참고 문서: docs/databatch/strategy.md
  # ─────────────────────────────────────────────────────────────
  # postgres:
  #   profiles: ["mart"]
  #   image: postgres:18-alpine
  #   container_name: bnviit-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB:-analytics}
  #     POSTGRES_USER: ${POSTGRES_USER:-analytics}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  #     TZ: Asia/Seoul
  #   ports:
  #     - "${POSTGRES_PORT:-5432}:5432"
  #   volumes:
  #     # postgres 18+ 는 /var/lib/postgresql (부모 경로) 마운트를 요구한다.
  #     # major 버전별 subdir(data, 18/main 등)을 컨테이너가 관리해 pg_upgrade --link 를 지원.
  #     - postgres-data:/var/lib/postgresql
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analytics} -d ${POSTGRES_DB:-analytics}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 20

  # ─────────────────────────────────────────────────────────────
  # 애플리케이션
  # 실행: docker compose up  (postgres 는 외부 개발 DB 사용)
  # SPRING_PROFILES_ACTIVE 는 backend/.env 또는 아래 environment 에서 지정 (기본 mssql).
  # ─────────────────────────────────────────────────────────────
  analytics:
    build:
      context: .
      dockerfile: Dockerfile
    image: bviit-analytics:${IMAGE_TAG:-latest}
    container_name: bviit-analytics
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18080}:18080"
    # postgres 컨테이너 재활성화 시 아래 depends_on 도 함께 주석 해제.
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #     required: false
    # backend/.env 가 실제 파일. 프로젝트 루트 .env 는 이 파일로의 symlink.
    #   - env_file: backend/.env  → analytics 컨테이너 런타임 환경변수
    #   - 루트 .env (symlink)      → docker-compose.yml 의 ${VAR} 치환용 (postgres 초기화 등)
    env_file:
      - backend/.env
    environment:
      # Spring profile ({local|dev|prod} 권장 / 레거시: mssql,postgres,postgres-mart / 미지정=H2).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mssql}
      SERVER_PORT: "18080"
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:18080}
      STATS_CACHE_DIR: /app/.cache/stats
      # postgres 컨테이너 비활성화 상태 — POSTGRES_URL 은 backend/.env 에서 외부 개발 DB 주소로 지정.
      # 컨테이너 재활성화 시 기본값을 jdbc:postgresql://postgres:5432/${POSTGRES_DB:-analytics} 로 되돌린다.
      POSTGRES_URL: ${POSTGRES_URL}
      # 레거시 홈페이지 온라인 예약 소스(예약자 리스트_홈페이지). 기본은 꺼짐 —
      # backend/.env 의 값은 호스트 경로라 컨테이너에서 못 읽으므로 여기서 빈 값으로 덮는다.
      # (빈 값이면 관련 빈이 안 떠서 해당 API 만 503. 앱 기동에는 영향 없다.)
      # 도커에서도 쓰려면: 아래 volumes 의 마운트 주석을 풀고 이 값을 컨테이너 경로로 지정.
      #   LEGACY_DATASOURCE_URL: jdbc:sqlite:/app/legacy/legacy-consultations.sqlite?open_mode=1
      LEGACY_DATASOURCE_URL: ${LEGACY_DATASOURCE_URL_CONTAINER:-}
    volumes:
      - analytics-cache:/app/.cache
      # 레거시 온라인 예약 스냅샷을 읽기 전용으로 마운트할 때 사용.
      # 호스트 경로는 각자 다르므로 backend/.env 에 LEGACY_CACHE_FILE 을 정의해 쓸 것.
      # - ${LEGACY_CACHE_FILE}:/app/legacy/legacy-consultations.sqlite:ro

volumes:
  analytics-cache:
  # postgres 컨테이너 재활성화 시 아래 볼륨 주석 해제.
  # postgres-data:

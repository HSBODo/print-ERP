services:
  # ─────────────────────────────────────────────────────────────
  # Postgres — 외부 개발 DB 를 사용하므로 컨테이너 기동 비활성화.
  # 재활성화하려면 아래 블록·depends_on·postgres-data 볼륨 주석을 해제하고
  # docker compose --profile mart up -d 로 기동한다.
  # 참고 문서: docs/databatch/strategy.md
  # ─────────────────────────────────────────────────────────────
  # postgres:
  #   profiles: ["mart"]
  #   image: postgres:18-alpine
  #   container_name: bnviit-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB:-analytics}
  #     POSTGRES_USER: ${POSTGRES_USER:-analytics}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  #     TZ: Asia/Seoul
  #   ports:
  #     - "${POSTGRES_PORT:-5432}:5432"
  #   volumes:
  #     # postgres 18+ 는 /var/lib/postgresql (부모 경로) 마운트를 요구한다.
  #     # major 버전별 subdir(data, 18/main 등)을 컨테이너가 관리해 pg_upgrade --link 를 지원.
  #     - postgres-data:/var/lib/postgresql
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analytics} -d ${POSTGRES_DB:-analytics}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 20

  # ─────────────────────────────────────────────────────────────
  # 애플리케이션
  # 실행: docker compose up -d
  #
  # 자세한 env 는 backend/.env.example 참고.
  # ─────────────────────────────────────────────────────────────
  analytics:
    build:
      context: .
      dockerfile: Dockerfile
      # Nexus(사내 Maven 저장소) 인증. Dockerfile 이 BuildKit secret 으로 읽는다.
      # 로컬: backend/.env 의 NEXUS_USERNAME/NEXUS_PASSWORD 를 env 시크릿으로 전달.
      # 젠킨스: 파이프라인이 `docker build --secret id=nexus_id,env=NEXUS_USERNAME` 로 직접 주입 —
      # 이 secrets 블록은 로컬 `docker compose build` 경로에서만 사용됨.
      secrets:
        - nexus_id
        - nexus_pw
    image: bviit-analytics:${IMAGE_TAG:-latest}
    container_name: bviit-analytics
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18080}:18080"
    # postgres 컨테이너 재활성화 시 아래 depends_on 도 함께 주석 해제.
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #     required: false
    env_file:
      - backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: "18080"
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:18080}
      STATS_CACHE_DIR: /app/.cache/stats
      POSTGRES_URL: ${POSTGRES_URL}
      # 그 외 env (WAREHOUSE_*, SOLAPI_* 등) 는 위 env_file(backend/.env)에서 주입한다.
      # 여기서 ${...:-}로 다시 선언하면 Compose 보간 단계의 빈 값이 env_file 값을 덮어쓴다.
    volumes:
      - analytics-cache:/app/.cache

volumes:
  analytics-cache:
  # postgres 컨테이너 재활성화 시 아래 볼륨 주석 해제.
  # postgres-data:

# ─────────────────────────────────────────────────────────────
# BuildKit 시크릿 — analytics.build 가 참조 (로컬 compose 빌드 시).
# Dockerfile 내부: --mount=type=secret,id=nexus_id / nexus_pw
# 값은 backend/.env 의 NEXUS_USERNAME / NEXUS_PASSWORD 환경변수에서 조달.
# 젠킨스 파이프라인은 docker build 를 직접 호출해 --secret 로 넘기므로 이 블록과 무관.
# ─────────────────────────────────────────────────────────────
secrets:
  nexus_id:
    environment: NEXUS_USERNAME
  nexus_pw:
    environment: NEXUS_PASSWORD

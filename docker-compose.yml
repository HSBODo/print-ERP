# ─────────────────────────────────────────────────────────────
# 앱 + Postgres
#
#   cp backend/.env.example backend/.env       # 최초 1회
#   docker compose up -d --build               # 전체 기동 → http://localhost:18080
#   docker compose up -d postgres              # DB 만 (백엔드는 gradle bootRun 으로 개발)
#   docker compose down                        # 중지
#   docker compose down -v                     # DB 데이터까지 삭제
# ─────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: app-template:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-18080}:18080"
    env_file:
      - backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: "18080"
      # 컨테이너 안에서는 postgres 서비스로 접속한다.
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-app}

volumes:
  postgres-data:

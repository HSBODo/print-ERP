<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>용어사전 — 비앤빛 Analytics</title>
<style>
  :root {
    --bg: #f6f6f7; --card: #ffffff; --border: #ececec; --line: #eaeaec;
    --ink: #1f2328; --muted: #5b6470; --muted-2: #8a909a;
    --accent: #7c5cff; --accent-soft: #efebff; --accent-ink: #5b3fd1;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.65; }

  /* ===== 상단 탭바 (prd.html 과 동일) ===== */
  .tabbar { padding: 0 18px; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 40; }
  .tabs { display: flex; align-items: center; gap: 2px; height: 52px; overflow-x: auto; }
  .tab { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border: 1px solid transparent; border-radius: 10px;
    background: none; font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1.35; color: var(--muted-2);
    cursor: pointer; white-space: nowrap; text-decoration: none; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--ink); background: #fff; border-color: var(--border); box-shadow: 0 1px 2px rgba(16,18,29,.06); }
  .tab .beta { font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 6px; }
  .sep { color: #d4d6da; font-size: 11px; letter-spacing: 2px; }

  .shell { max-width: 1320px; margin: 0 auto; padding: 30px 22px 80px; }
  .body-row { display: flex; gap: 26px; align-items: flex-start; }
  .term-nav { width: 224px; flex-shrink: 0; position: sticky; top: 64px;
    max-height: calc(100vh - 90px); overflow-y: auto; padding: 4px 6px 20px 0;
    border-right: 1px solid var(--line); }
  .term-nav .tn-grp { font-size: 11px; font-weight: 800; color: var(--muted-2);
    letter-spacing: 1px; margin: 14px 8px 4px; }
  .term-nav .tn-grp:first-child { margin-top: 2px; }
  .term-nav a { display: block; padding: 4px 10px; border-radius: 7px; font-size: 13px;
    color: var(--muted); text-decoration: none; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .term-nav a:hover { background: #efeff1; color: var(--ink); }
  .term-nav a .w { color: #b45309; font-size: 11px; }
  .content { flex: 1; min-width: 0; }
  .term { scroll-margin-top: 230px; }
  @media (max-width: 920px) { .term-nav { display: none; } }
  h1 { font-size: 24px; font-weight: 800; margin: 4px 0 6px; }
  .lead { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  .lead b { color: var(--ink); }

  /* ===== 컨트롤 ===== */
  .controls { position: sticky; top: 52px; z-index: 30; background: var(--bg);
    padding: 10px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .search-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #q { flex: 1; min-width: 240px; height: 42px; padding: 0 16px; border: 1px solid var(--border); border-radius: 12px;
    font: inherit; font-size: 15px; background: #fff; outline: none; box-shadow: 0 1px 2px rgba(16,18,29,.04); }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .count { font-size: 13px; color: var(--muted-2); white-space: nowrap; }
  .count b { color: var(--accent-ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip-btn { padding: 6px 13px; border: 1px solid var(--border); border-radius: 999px; background: #fff;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .chip-btn:hover { color: var(--ink); }
  .chip-btn.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .idx { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 8px; }
  .idx button { min-width: 30px; height: 28px; padding: 0 7px; border: 1px solid transparent; border-radius: 8px;
    background: none; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .idx button:hover { background: #ececef; color: var(--ink); }
  .idx button.on { background: var(--accent); color: #fff; }
  .idx button:disabled { color: #cfd2d8; cursor: default; background: none; }
  .idx .lbl { align-self: center; font-size: 11.5px; font-weight: 700; color: var(--muted-2); margin-right: 4px; width: 30px; }

  /* ===== 항목 ===== */
  .term { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 22px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(16,18,29,.04); }
  .t-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .t-name { font-size: 17px; font-weight: 800; }
  .t-en { font-size: 13.5px; color: var(--muted-2); font-weight: 600; }
  .t-cat { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .cat-surgery { background: #efebff; color: #5b3fd1; }
  .cat-lens    { background: #e6f4ff; color: #0b6bb5; }
  .cat-equip   { background: #e9edf9; color: #3d55a5; }
  .cat-exam    { background: #e7f8ef; color: #147a46; }
  .cat-rsv     { background: #fdeff8; color: #a3286e; }
  .cat-metric  { background: #fff3e0; color: #a15c00; }
  .cat-pay     { background: #ffecec; color: #b02a2a; }
  .cat-supp    { background: #f2f8e5; color: #55701a; }
  .cat-msg     { background: #e0f7f4; color: #0b7a6c; }
  .cat-system  { background: #f0f1f4; color: #4b5563; }
  .t-alias { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .t-alias span { font-size: 11.5px; font-weight: 600; color: var(--muted); background: #f2f3f5;
    border: 1px solid var(--line); padding: 1px 8px; border-radius: 6px; }
  .t-def { margin: 9px 0 0; color: var(--ink); font-size: 14.5px; }
  .t-tblwrap { overflow-x: auto; margin-top: 10px; }
  .t-tbl { border-collapse: collapse; font-size: 13px; min-width: 60%; }
  .t-tbl th, .t-tbl td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; vertical-align: top; }
  .t-tbl th { background: #f7f7f9; font-weight: 700; white-space: nowrap; color: var(--muted); }
  .t-tbl td:first-child { font-weight: 700; white-space: nowrap; color: var(--ink); }
  .t-sys { margin: 9px 0 0; padding: 10px 14px; background: var(--accent-soft); border-radius: 10px;
    font-size: 13.5px; color: var(--accent-ink); }
  .t-sys::before { content: "우리 시스템에서 · "; font-weight: 800; }
  .t-foot { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12.5px; color: var(--muted-2); }
  .t-foot b { color: var(--muted); font-weight: 700; }
  .t-foot a { color: var(--accent-ink); text-decoration: none; font-weight: 600; }
  .t-foot a:hover { text-decoration: underline; }
  .t-warn { font-size: 11px; font-weight: 800; color: #b45309; background: #fff3e0;
    border: 1px solid #fde3bd; padding: 1px 8px; border-radius: 999px; }
  .chip-btn.trap.on { background: #b45309; border-color: #b45309; }
  mark { background: #ffe9a8; color: inherit; padding: 0 1px; border-radius: 3px; }
  .empty { text-align: center; color: var(--muted-2); padding: 60px 0; font-size: 15px; }
  .grp { font-size: 13px; font-weight: 800; color: var(--muted-2); margin: 26px 2px 10px; letter-spacing: 1px; }
</style>
</head>

  <div class="shell">
    <h1>용어사전</h1>
    <p class="lead">대시보드에 나오는 수술명·검사·지표·수납 용어를 모았다.
      일반 정의와 <b>우리 시스템에서의 의미</b>가 다른 용어가 많으니 보라색 상자를 먼저 읽을 것.
      산식은 여기 다시 쓰지 않는다 — <b>지표 정의</b> 링크로 잇는다.</p>

    <div class="body-row">
    <aside class="term-nav" id="tnav"></aside>
    <div class="content">
    <div class="controls">
      <div class="search-row">
        <input id="q" type="search" placeholder="용어 검색 — 한글, 영문, 별칭 모두 됩니다 (예: 스마일, ICL, 백대백)" autocomplete="off">
        <span class="count"><b id="nShown">0</b> / <span id="nAll">0</span>개</span>
      </div>
      <div class="chips" id="cats"></div>
      <div class="idx" id="idxKo"><span class="lbl">ㄱ~ㅎ</span></div>
      <div class="idx" id="idxEn"><span class="lbl">A~Z</span></div>
    </div>

    <div id="list"></div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  용어 데이터 — 여기만 고치면 된다. 화면은 자동으로 따라온다.
//  cat: surgery(수술·시술) lens(렌즈·인공수정체) exam(검사·진료) rsv(예약·채널)
//       metric(지표·통계) pay(수납·회계) msg(문자·알림) system(시스템·데이터)
//  sys: "우리 시스템에서" 주석 (일반 정의와 다르거나 자체 규칙이 있을 때만)
//  trap: true 면 ⚠ 함정 주의 표시 — 이름이 비슷하거나 직관과 다르게 동작하는 용어
//  link: 관련 지표정의 문서
// ═══════════════════════════════════════════════════════════════════
var TERMS = [

// ── 수술·시술 ──────────────────────────────────────────────
{ name:'시력교정', en:'Vision Correction', alias:['굴절교정'], cat:'surgery',
  def:'근시·난시 등 굴절 이상을 수술로 교정해 안경·렌즈 없이 보게 하는 것. 각막을 다듬는 레이저 계열(라식·라섹·스마일)과 눈 안에 렌즈를 넣는 렌즈삽입 계열(ICL·KPL)로 갈린다.',
  sys:'병원의 양대 진료 축(시력교정 · 백내장) 중 하나 — 예약통계·검사·수술 지표가 전부 이 축으로 갈린다. 전액 비급여라 매출은 SOFTCRM 에 담기고, 수술 유형은 문자열 매칭으로 10종 분류한다. SOFTCRM 수납의 수술구분 값도 「시력교정」이다.',
  menus:['예약통계_시력교정','수술 건수','전환율'], link:{label:'지표정의 4 — 수술', href:'지표정의/5-수술.html'} },
{ name:'스마일', en:'SMILE', alias:['SMILE+X','스마일라식'], cat:'surgery',
  def:'Small Incision Lenticule Extraction. 각막 절편(플랩)을 만들지 않고 2~4mm 미세 절개로 각막 실질 조각(렌티큘)을 빼내는 3세대 레이저 시력교정. 절개가 작아 각막 신경 손상과 건조증이 적다.',
  sys:'수술 유형 분류에서 SMILE PRO 가 먼저 걸리도록 판정 순서가 정해져 있다 — 문자열에 SMILE 이 있고 PRO 가 없으면 스마일.',
  menus:['수술 건수','주요 수술별 비중'], link:{label:'지표정의 4 — 수술', href:'지표정의/5-수술.html'} },
{ name:'스마일 프로', en:'SMILE PRO', alias:['SMILE PRO+X','스마일프로'], cat:'surgery',
  def:'차세대 장비 VISUMAX 800 으로 하는 스마일. 레이저 조사 시간이 눈당 약 10초 이내로 짧아지고 중심축 정렬(사이클로토션 보정)이 더해졌다.',
  sys:'수술 유형 분류에서 SMILE 보다 먼저 판정된다 — 순서가 바뀌면 스마일 프로가 전부 스마일로 잘못 세인다.',
  menus:['수술 건수','주요 수술별 비중'], link:{label:'지표정의 4 — 수술', href:'지표정의/5-수술.html'} },
{ name:'라식', en:'LASIK', alias:['VISU','EX500','iFS','FLAP LIFT'], cat:'surgery',
  def:'각막 절편(플랩)을 만들어 젖힌 뒤 레이저로 실질을 깎아 도수를 교정하는 시력교정. 회복이 빠르다.',
  sys:'수술 기록에는 장비명 조합으로 적힌다 — VISU+EX500 등. VISU(비쥬맥스)·iFS 는 플랩 장비, EX500 은 엑시머 레이저.',
  menus:['수술 건수','주요 수술별 비중'], link:{label:'지표정의 4 — 수술', href:'지표정의/5-수술.html'} },
{ name:'라섹', en:'LASEK', alias:['EYECLE','아이클','T-PRK','표면절제술'], cat:'surgery',
  def:'각막 상피를 벗겨내고 표면에 레이저를 조사하는 표면절제 방식 시력교정. 플랩이 없어 각막을 아끼고 외부 충격에 강하나 회복이 느리다.',
  sys:'수술 기록에는 원내 표기 EYECLE(아이클)로 적힌다 — EYECLE+RED(레드 레이저), EYECLE+EX500 등.',
  menus:['수술 건수','주요 수술별 비중'], link:{label:'지표정의 4 — 수술', href:'지표정의/5-수술.html'} },
{ name:'플랩', en:'Flap', alias:['각막 절편'], cat:'surgery',
  def:'라식에서 각막 표면을 뚜껑처럼 잘라 젖히는 절편. 펨토초 레이저(비쥬맥스·iFS 등)로 만든다.',
  sys:'플랩 유무가 수술 계보를 가른다 — 라식=플랩, 라섹=상피 제거(플랩 없음), 스마일=미세 절개(플랩 없음). 구형 수술코드의 플랩 자리(IN·LDV·VISU…)가 플랩 장비다.' },
{ name:'렌티큘', en:'Lenticule', alias:[], cat:'surgery',
  def:'스마일에서 각막 실질 안에 레이저로 만들어 미세 절개로 빼내는 얇은 조각. 이 조각의 두께만큼 도수가 교정된다.',
  sys:'플랩을 만들지 않고 렌티큘만 빼내는 것이 스마일이 라식과 갈리는 지점이다.' },
{ name:'안내렌즈삽입술', en:'PIOL (Phakic IOL)', alias:['렌즈삽입술','안내렌즈'], cat:'surgery',
  def:'수정체를 보존한 채 눈 안에 시력교정용 렌즈를 삽입하는 수술. 각막을 깎지 않아 고도근시·얇은 각막에 쓴다. ICL·KPL 계열이 여기 속한다.',
  sys:'지표에서 PIOL 5종(ICL·T-ICL·KPL·T-KPL·VIVA)은 환자당 「대표유형」 하나로만 센다 — 우안 우선, 우안에 없으면 좌안.',
  menus:['수술 건수','주요 수술별 비중'], link:{label:'지표정의 4 — 수술', href:'지표정의/5-수술.html'} },
{ name:'ICL', en:'Implantable Collamer Lens', alias:['EVO ICL','EVOp ICL','에보 아이씨엘'], cat:'surgery',
  def:'홍채 뒤·수정체 앞에 삽입하는 후방 안내렌즈. EVO 는 렌즈 중앙에 방수(눈 속 물) 통로 구멍을 낸 세대로, 홍채절개술 없이 시술한다.',
  sys:'유형 분류 키워드가 넓다 — IPCL·ARF·ART·ARTIFLEX·GLAZE·ECHO 도 전부 ICL 버킷으로 세인다.',
  menus:['수술 건수','주요 수술별 비중'], link:{label:'지표정의 4 — 수술', href:'지표정의/5-수술.html'} },
{ name:'T-ICL', en:'Toric ICL', alias:['EVOp T-ICL','토릭 ICL'], cat:'surgery',
  def:'난시 교정 도수가 들어간 토릭(Toric) ICL. 렌즈 축을 난시 축에 맞춰 삽입한다.',
  sys:'수술명 앞의 T- 접두는 렌즈·수술 공통으로 「토릭(난시 교정)」을 뜻한다.',
  menus:['수술 건수'], link:{label:'지표정의 4 — 수술', href:'지표정의/5-수술.html'} },
{ name:'VIVA ICL', en:'EVO VIVA ICL', alias:['비바'], cat:'surgery',
  def:'노안 연령대를 겨냥해 초점 심도를 넓힌 EVO ICL 계열 렌즈. 근거리 시력 보정을 함께 노린다.',
  sys:'PIOL 5종 중 별개 유형(viva)으로 센다 — 대표유형 규칙(환자당 1유형)이 똑같이 적용된다.',

{ name:'KPL', en:'PhakiFlex KPL', alias:['T-KPL','KPL렌즈','케이피엘'], cat:'surgery',

// ═══════════════════════════════════════════════════════════════════
//  화면 로직
// ═══════════════════════════════════════════════════════════════════
(function () {
  'use strict';
  var CATS = [
    ['all', '전체'], ['surgery', '수술·시술'], ['lens', '렌즈·인공수정체'], ['equip', '장비'],
    ['exam', '검사·진료'], ['rsv', '예약·채널'], ['metric', '지표·통계'], ['pay', '수납·회계'], ['supp', '영양제·건기식'], ['msg', '문자·알림'], ['system', '시스템·데이터']
  ];
  var CAT_LABEL = {}; CATS.forEach(function (c) { CAT_LABEL[c[0]] = c[1]; });
  var CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  var CHO_BASE = { 'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ' };
  var KO_KEYS = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  var EN_KEYS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

  function initialOf(name) {
    var ch = name.charAt(0);
    var code = ch.charCodeAt(0);
    if (code >= 0xAC00 && code <= 0xD7A3) {
      var cho = CHO[Math.floor((code - 0xAC00) / 588)];
      return CHO_BASE[cho] || cho;
    }
    if (/[a-zA-Z]/.test(ch)) return ch.toUpperCase();
    return '#';   // 기호로 시작 — (P) 접미 등
  }
  TERMS.forEach(function (t, i) { t._init = initialOf(t.name); t._id = 'term-' + i; });

  // 정렬 — 한글 가나다 먼저, 그다음 A~Z, 기호는 끝
  TERMS.sort(function (a, b) {
    var ra = a._init === '#' ? 2 : /[A-Z]/.test(a._init) ? 1 : 0;
    var rb = b._init === '#' ? 2 : /[A-Z]/.test(b._init) ? 1 : 0;
    if (ra !== rb) return ra - rb;
    return a.name.localeCompare(b.name, 'ko');
  });

  var st = { q: '', cat: 'all', init: null, trapOnly: false };
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function hl(s, q) {
    var h = esc(s);
    if (!q) return h;
    var i = h.toLowerCase().indexOf(q.toLowerCase());
    if (i === -1) return h;
    return h.slice(0, i) + '<mark>' + h.slice(i, i + q.length) + '</mark>' + h.slice(i + q.length);
  }

  // 검색 우선순위 — 0: 표제어, 1: 영문·별칭, 2: 본문(정의·시스템 주석·표). -1: 불일치
  function tierOf(t) {
    if (!st.q) return 0;
    var q = st.q.toLowerCase();
    if (t.name.toLowerCase().indexOf(q) !== -1) return 0;
    var sub = ((t.en || '') + ' ' + (t.alias || []).join(' ')).toLowerCase();
    if (sub.indexOf(q) !== -1) return 1;
    var body = (t.def + ' ' + (t.sys || '') + ' ' +
      (t.table || []).map(function (r) { return r.join(' '); }).join(' ')).toLowerCase();
    if (body.indexOf(q) !== -1) return 2;
    return -1;
  }

  function matches(t) {
    if (st.trapOnly && !t.trap) return false;
    if (st.cat !== 'all' && t.cat !== st.cat) return false;
    if (st.init && t._init !== st.init) return false;
    return tierOf(t) >= 0;
  }

  var TIER_LABEL = ['표제어 일치', '영문·별칭 일치', '본문 일치'];

  function render() {
    var rows = TERMS.filter(matches);
    if (st.q) rows = rows.slice().sort(function (a, b) { return tierOf(a) - tierOf(b); });
    $('nShown').textContent = rows.length;
    $('nAll').textContent = TERMS.length;

    var list = $('list');
    if (!rows.length) {
      list.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
      return;
    }
    var html = [], lastInit = null, lastTier = -1;
    rows.forEach(function (t) {
      if (st.q) {
        var tr = tierOf(t);
        if (tr !== lastTier) {
          lastTier = tr;
          html.push('<div class="grp">' + TIER_LABEL[tr] + '</div>');
        }
      } else if (!st.init && t._init !== lastInit) {
        lastInit = t._init;
        html.push('<div class="grp">' + esc(lastInit === '#' ? '기호' : lastInit) + '</div>');
      }
      var head = '<div class="t-head"><span class="t-name">' + hl(t.name, st.q) + '</span>';
      if (t.trap) head += '<span class="t-warn">⚠ 함정 주의</span>';
      if (t.en) head += '<span class="t-en">' + hl(t.en, st.q) + '</span>';
      head += '<span class="t-cat cat-' + t.cat + '">' + CAT_LABEL[t.cat] + '</span></div>';

      var alias = '';
      if (t.alias && t.alias.length) {
        alias = '<div class="t-alias">' + t.alias.map(function (a) {
          return '<span>' + hl(a, st.q) + '</span>';
        }).join('') + '</div>';
      }
      var body = '<p class="t-def">' + hl(t.def, st.q) + '</p>';
      if (t.table) {
        body += '<div class="t-tblwrap"><table class="t-tbl">';
        t.table.forEach(function (row) {
          body += '<tr>' + row.map(function (c) { return '<td>' + hl(c, st.q) + '</td>'; }).join('') + '</tr>';
        });
        body += '</table></div>';
      }
      if (t.sys) body += '<div class="t-sys">' + hl(t.sys, st.q) + '</div>';

      var foot = [];
      if (t.menus && t.menus.length) foot.push('<span><b>등장 화면</b> ' + t.menus.map(esc).join(' · ') + '</span>');
      if (t.link) foot.push('<span><b>산식·규칙</b> <a href="' + t.link.href + '">' + esc(t.link.label) + ' →</a></span>');
      var footHtml = foot.length ? '<div class="t-foot">' + foot.join('') + '</div>' : '';

      html.push('<div class="term" id="' + t._id + '">' + head + alias + body + footHtml + '</div>');
    });
    list.innerHTML = html.join('');
    renderNav(rows);
  }

  // 좌측 용어 목차 — 목록과 같은 순서·같은 그룹으로. 클릭하면 해당 카드로 스크롤
  function renderNav(rows) {
    var nav = document.getElementById('tnav');
    if (!nav) return;
    var html = [], lastInit = null;
    var grouped = !st.q && !st.init;
    rows.forEach(function (t) {
      if (grouped && t._init !== lastInit) {
        lastInit = t._init;
        html.push('<div class="tn-grp">' + esc(lastInit === '#' ? '기호' : lastInit) + '</div>');
      }
      html.push('<a href="#' + t._id + '" title="' + esc(t.name) + '">' +
        esc(t.name) + (t.trap ? ' <span class="w">⚠</span>' : '') + '</a>');
    });
    nav.innerHTML = html.join('');
    Array.prototype.forEach.call(nav.querySelectorAll('a'), function (aEl) {
      aEl.onclick = function (e) {
        e.preventDefault();
        var el = document.getElementById(this.getAttribute('href').slice(1));
        if (!el) return;
        // 고정된 탭바(52px) + 검색바 실제 높이만큼 내려서 카드 머리가 가리지 않게
        var ctr = document.querySelector('.controls');
        var off = 52 + (ctr ? ctr.offsetHeight : 0) + 14;
        var y = el.getBoundingClientRect().top + window.pageYOffset - off;
        window.scrollTo({ top: y, behavior: 'smooth' });
      };
    });
  }

  // 카테고리 칩
  var catBox = $('cats');
  CATS.forEach(function (c) {
    var b = document.createElement('button');
    b.className = 'chip-btn' + (c[0] === st.cat ? ' on' : '');
    b.textContent = c[1];
    b.onclick = function () {
      st.cat = c[0];
      Array.prototype.forEach.call(catBox.children, function (x) { x.className = 'chip-btn'; });
      b.className = 'chip-btn on';
      render();
    };
    catBox.appendChild(b);
  });
  // 혼동하기 쉬운 용어만 모아 보는 토글 — 카테고리와 독립으로 동작
  (function () {
    var b = document.createElement('button');
    b.className = 'chip-btn trap';
    var setLabel = function () {
      b.textContent = '⚠ 함정 주의만 (' + TERMS.filter(function (t) { return t.trap; }).length + ')';
    };
    setLabel();
    b.onclick = function () {
      st.trapOnly = !st.trapOnly;
      b.classList.toggle('on', st.trapOnly);
      render();
    };
    catBox.appendChild(b);
  })();

  // 초성·알파벳 인덱스 (해당 항목이 없는 글자는 비활성)
  var have = {};
  TERMS.forEach(function (t) { have[t._init] = 1; });
  function buildIdx(box, keys) {
    keys.forEach(function (k) {
      var b = document.createElement('button');
      b.textContent = k;
      b.disabled = !have[k];
      b.onclick = function () {
        st.init = (st.init === k) ? null : k;
        document.querySelectorAll('.idx button').forEach(function (x) { x.classList.remove('on'); });
        if (st.init) b.classList.add('on');
        render();
      };
      box.appendChild(b);
    });
  }
  buildIdx($('idxKo'), KO_KEYS);
  buildIdx($('idxEn'), EN_KEYS);

  $('q').addEventListener('input', function () { st.q = this.value.trim(); render(); });
  render();
})();
</script>
</body>
</html>

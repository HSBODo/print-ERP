# ─────────────────────────────────────────────────────────────
# 로컬 개발용 compose — Dockerfile.local 을 쓰고 infisical 관련 env 를 요구하지 않는다.
#
# 사용법:
#   DOCKER_BUILDKIT=1 docker compose -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.local.yml down
#
# 원본과의 차이:
#   1) dockerfile: Dockerfile.local (infisical 없는 3-stage 빌드)
#   2) INFISICAL_PROJECT_ID / INFISICAL_ENV env 미주입
#   3) SPRING_PROFILES_ACTIVE 기본값을 local 로 (원본은 prod).
#      마트 붙여 테스트하려면 SPRING_PROFILES_ACTIVE=prod 로 실행.
#
# backend/.env 는 원본과 동일하게 그대로 사용한다.
# ─────────────────────────────────────────────────────────────
services:
  analytics:
    build:
      context: .
      dockerfile: Dockerfile.local
      secrets:
        - nexus_id
        - nexus_pw
    image: bviit-analytics:${IMAGE_TAG:-local}
    container_name: bviit-analytics-local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18080}:18080"
    env_file:
      - backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: "18080"
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:18080,http://localhost:15173}
      STATS_CACHE_DIR: /app/.cache/stats
      # POSTGRES_URL·HOMEPAGE_DATASOURCE_URL 등 도메인별 값은 backend/.env 에서 조달.
      # 여기서 ${...:-}로 재선언하지 말 것 — Compose 보간 빈 값이 env_file 값을 덮어쓴다.
    volumes:
      - analytics-cache-local:/app/.cache

volumes:
  analytics-cache-local:

secrets:
  nexus_id:
    environment: NEXUS_USERNAME
  nexus_pw:
    environment: NEXUS_PASSWORD
